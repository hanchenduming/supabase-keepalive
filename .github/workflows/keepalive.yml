name: Supabase Keepalive

on:
  schedule:
    # 每天 UTC 时间 0:00 和 12:00 执行（北京时间 8:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -f --retry 3 --retry-delay 2 --max-time 20 \
            -o /dev/null -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "Ping OK: HTTP $code"

      - name: Log result
        run: echo "Keepalive ping sent at $(date -u +%FT%TZ)"
